name: Sync html-exp2

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

concurrency:
  group: sync-html-exp2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages site
        uses: actions/checkout@v4

      - name: Fetch homework from html-exp2
        run: |
          git clone --depth 1 https://github.com/ChaoJueAMeng/html-exp2.git /tmp/html-exp2
          mkdir -p html-exp2
          cp /tmp/html-exp2/index.html /tmp/html-exp2/exp_2_1.html /tmp/html-exp2/exp_2_2.html \
             /tmp/html-exp2/image-ex-2-1-tianxia.jpg /tmp/html-exp2/image-ex-2-2-tiananmen.jpg \
             .
          cp /tmp/html-exp2/index.html /tmp/html-exp2/exp_2_1.html /tmp/html-exp2/exp_2_2.html \
             /tmp/html-exp2/image-ex-2-1-tianxia.jpg /tmp/html-exp2/image-ex-2-2-tiananmen.jpg \
             html-exp2/
          touch .nojekyll html-exp2/.nojekyll

      - name: Commit synced pages
        run: |
          git config user.name "github-pages-sync"
          git config user.email "41898282+github-pages-sync[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "同步 html-exp2 静态页面到 GitHub Pages"
          git push
